<aside class="preview-pane" aria-label="被试视角预览">
  <div class="preview-header">
    <div class="preview-title"><svg width="15" height="15" viewBox="0 0 18 18" fill="none" aria-hidden="true"><rect x="2" y="2.5" width="14" height="10" rx="1.6" stroke="currentColor" stroke-width="1.3"/><path d="M6 15.5h6M9 12.5v3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg><span>被试会看到</span></div>
    <span class="preview-badge" id="previewBadge">等待转换</span>
  </div>

  <div class="preview-stage" id="previewStage">
    <div class="preview-stack" id="previewStack">

      <!-- 空态：还没转换，没有内容可预览 -->
      <div class="preview-empty" id="previewEmpty">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="2" y="4" width="20" height="13" rx="2" stroke="currentColor" stroke-width="1.4"/><path d="M9 21h6M12 17v4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M8.5 10.5h7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="2 2.4"/></svg>
        <p class="empty-title">预览窗口</p>
        <p class="empty-copy">还没有可预览的内容。<br>左边选择实验文件夹并点击<b>打包成单文件</b>之后，<br>这里会显示被试打开文件后看到的画面：<br><b>① 开始页　② 实验第 1 页</b></p>
      </div>

      <!-- 转换后：两页轮播。iframe 里跑的是**真实产物**，不是示意图 -->
      <div class="preview-carousel" id="previewCarousel" hidden>
        <div class="participant-window">
          <div class="participant-titlebar" aria-hidden="true">
            <span class="mini-traffic"><i></i><i></i><i></i></span>
            <span class="participant-window-title" id="pvSlideTitle">被试打开文件后第一眼</span>
            <span class="participant-window-meta" id="pvSlideIndex">1 / 2</span>
          </div>
          <div class="participant-viewport" id="participantViewport">
            <iframe class="preview-frame" id="pvFrame0" title="预览：开始页"></iframe>
            <iframe class="preview-frame" id="pvFrame1" title="预览：实验第 1 页" hidden></iframe>
          </div>
        </div>
        <div class="preview-nav" role="group" aria-label="切换预览页">
          <button type="button" id="pvPrev" aria-label="上一页">‹</button>
          <span class="pv-dots" id="pvDots" aria-hidden="true"><i class="on"></i><i></i></span>
          <button type="button" id="pvNext" aria-label="下一页">›</button>
        </div>
      </div>

    </div>
  </div>
  <p class="preview-foot" id="previewFoot">转换后在此显示被试看到的画面</p>
</aside>
